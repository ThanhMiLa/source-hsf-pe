<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car Management</title>
</head>
<body>

<!-- 1. SYSTEM TITLE -->
<h1>Car Management</h1>
<hr/>

<!-- 2. PAGE HEADING -->
<h2>View Car Detail</h2>

<!-- 3. READ-ONLY DETAIL TABLE -->
<table border="0" cellpadding="5">
    <!-- FIELD 1: String Field -->
    <tr>
        <td><label for="model">Model:</label></td>
        <td>
            <input type="text" id="model" th:value="${carDto.model}" readonly/>
        </td>
    </tr>

    <tr>
        <td><label for="brand">Brand:</label></td>
        <td>
            <input type="text" id="brand" th:value="${carDto.brand}" readonly/>
        </td>
    </tr>

    <tr>
        <td><label for="price">Price ($):</label></td>
        <td>
            <input type="text" id="price" th:value="${carDto.price}" readonly/>
        </td>
    </tr>

    <tr>
        <td><label for="status">Status:</label></td>
        <td>
            <input type="text" id="status" th:value="${carDto.status}" readonly/>
        </td>
    </tr>

    <tr>
        <td><label for="color">Color:</label></td>
        <td>
            <input type="text" id="color" th:value="${carDto.color}" readonly/>
        </td>
    </tr>

    <tr>
        <td><label for="year">Year:</label></td>
        <td>
            <input type="text" id="year" th:value="${carDto.year}" readonly/>
        </td>
    </tr>


    <tr>
        <td><label for="plate">Plate:</label></td>
        <td>
            <input type="text" id="plate" th:value="${carDto.plate}" readonly/>
        </td>
    </tr>



    <!-- 4. ACTION BUTTON (BACK ONLY) -->
    <tr>
        <td></td>
        <td>
            <a th:href="@{/cars}">
                <button type="button">Back</button>
            </a>
        </td>
    </tr>
</table>

</body>
</html>
