<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Template Management</title>
</head>
<body>

<!-- 1. SYSTEM TITLE -->
<h1>Template Management</h1>
<hr/>

<!-- 2. PAGE HEADING -->
<h2>View Device Info</h2>

<!-- 3. READ-ONLY DETAIL TABLE -->
<table border="0" cellpadding="5">
    <!-- Copy thẻ <tr> ra theo sô lượng filed muốn hiển thị-->
    <tr>
        <td><label for="deviceCode">Device Code:</label></td>
        <td>
            <input type="text" id="deviceCode" th:value="${deviceDto.deviceCode}" readonly/>
        </td>
    </tr>

    <tr>
        <td><label for="deviceName">Device name:</label></td>
        <td>
            <input type="text" id="deviceName" th:value="${deviceDto.deviceName}" readonly/>
        </td>
    </tr>

    <tr>
        <td><label for="warrantyMonths">Warranty:</label></td>
        <td>
            <input type="text" id="warrantyMonths" th:value="${deviceDto.warrantyMonths}" readonly/>
        </td>
    </tr>


    <tr>
        <td><label for="status">Status:</label></td>
        <td>
            <input type="text" id="status" th:value="${deviceDto.status}" readonly/>
        </td>
    </tr>

    <tr>
        <td><label for="categoryName">Category:</label></td>
        <td>
            <input type="text" id="categoryName" th:value="${deviceDto.categoryName}" readonly/>
        </td>
    </tr>


    <tr>
        <td><label for="price">Price ($):</label></td>
        <td>
            <input type="text" id="price" th:value="${deviceDto.price}" readonly/>
        </td>
    </tr>

    <tr>
        <td><label for="installationDate">Installation Date:</label></td>
        <td>
            <input type="text" id="installationDate" th:value="${deviceDto.installationDate}" readonly/>
        </td>
    </tr>

    <!-- 4. ACTION BUTTON (BACK ONLY) -->
    <tr>
        <td></td>
        <td>
            <a th:href="@{/devices}">
                <button type="button">Back</button>
            </a>
        </td>
    </tr>
</table>

</body>
</html>
